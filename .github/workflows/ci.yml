name: CI

# No real API keys anywhere: the server tests use the mock AI and an in-memory MongoDB, and the browser tests run the
# real client against the real server on the mock AI.
on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run check
        working-directory: server
      - run: npm test
        working-directory: server

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: No secrets in the built client
        working-directory: client
        run: |
          if grep -rE "AIza[0-9A-Za-z_-]{20,}|mongodb\+srv|GEMINI|JWT_SECRET|gsk_[0-9A-Za-z]{20,}" dist/; then echo "LEAK"; exit 1; fi
          echo "bundle clean"
      - name: No raw HTML injection in the client source
        working-directory: client
        run: |
          if grep -rn "dangerouslySetInnerHTML" src/; then echo "REVIEW"; exit 1; fi
          echo "no raw html"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets committed
        run: |
          if git grep -nE "AIza[0-9A-Za-z_-]{20,}|mongodb\+srv://[^<]*:[^<]*@|gsk_[0-9A-Za-z]{20,}|xai-[0-9A-Za-z]{20,}" -- . ':!*.md' ':!.github'; then echo "SECRET FOUND"; exit 1; fi
          echo clean

  e2e:
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npx playwright test
        working-directory: client
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7
