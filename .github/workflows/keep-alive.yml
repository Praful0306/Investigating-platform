name: Keep the API awake

# A free Render service sleeps after 15 minutes without requests, and the next visitor waits about a minute.
# This asks the API for /api/health every 10 minutes from outside, which also wakes it if it ever did go to sleep.
# It needs one repository VARIABLE (not a secret; the address is public): Settings -> Secrets and variables -> Actions
# -> Variables -> New repository variable -> KEEP_ALIVE_URL = https://<your-service>.onrender.com
# Note: GitHub switches scheduled workflows off on a public repository after 60 days without any repository activity.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        env:
          URL: ${{ vars.KEEP_ALIVE_URL }}
        run: |
          if [ -z "$URL" ]; then echo "KEEP_ALIVE_URL is not set: nothing to ping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "${URL%/}/api/health"
